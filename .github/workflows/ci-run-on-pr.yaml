name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # In the merge queue everything runs (no path filter or draft condition): the tested commit is what lands on main
  merge_group:

env:
  # Golang version to use across CI steps
  GOLANG_VERSION: '1.26'

permissions:
  contents: read

jobs:
  codechanges:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # changed-files only works on pull requests; the merge queue always runs everything
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
        if: github.event_name == 'pull_request'
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Any file which is not under docs/, examples/, or is not a markdown file is counted as a backend file
          # Also run on any change under .github/ (workflows, action bumps, dependabot config):
          # otherwise all jobs are skipped, the matrix jobs never report their required
          # 'Run e2e tests (NN)' checks and the PR can never merge.
          files_yaml: |
            backend:
              - '!**.md'
              - '!**/*.md'
              - '!docs/**'
              - '!examples/**'
              - '!.github/**'
            ci:
              - '.github/**'
      - name: Decide whether the jobs run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend_any_changed }}
          CI_CHANGED: ${{ steps.filter.outputs.ci_any_changed }}
        run: |
          if [ "${EVENT}" != pull_request ]; then
            # Everything runs in the merge queue
            run=true
          elif [ "${DRAFT}" = true ]; then
            run=false
          elif [ "${BACKEND_CHANGED}" = true ] || [ "${CI_CHANGED}" = true ]; then
            run=true
          else
            run=false
          fi
          echo "run=${run}" | tee -a "${GITHUB_OUTPUT}"

  check-go:
    name: Ensure Go modules synchronicity
    runs-on: ubuntu-22.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.run == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Download all Go modules
        run: |
          go mod download
      - name: Check for tidiness of go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- .

  lint-go:
    name: Lint Go code
    runs-on: ubuntu-22.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.run == 'true' }}
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin golangci-lint itself; the action otherwise installs the latest
          # release, and new linter rules then break CI on unrelated PRs.
          # Built with go install (from the Go module proxy) instead of downloaded from GitHub releases
          version: v2.15.0
          install-mode: goinstall
          args: --verbose --timeout=10m

  shellcheck:
    name: Shellcheck
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      # shellcheck is preinstalled on the ubuntu runners, so this doesn't depend on a download from GitHub releases
      - name: Run ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs:
      - codechanges
    permissions:
      pull-requests: write
    if: ${{ needs.codechanges.outputs.run == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Golang
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Test
        run: make test
      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        with:
          config: .testcoverage.yaml
          profile: cover.out
          continue-on-error: true # Should fail after coverage comment is posted
      - name: Generate test results artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unittests-coverage
          path: cover.out
      - name: find pull request ID
        if: github.event_name == 'pull_request'
        run: |
          PR_ID=${GITHUB_REF_NAME%%/merge}
          echo "PR_ID: $PR_ID"

          if [ "$PR_ID" != "null" ]; then
            echo "pull_request_id=$PR_ID" >> $GITHUB_ENV
          else
            echo "No open pull request found for this branch."
          fi
      - name: create badge
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        with:
          profile: cover.out
          threshold-total: 26
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges
      - name: post coverage report
        if: github.event_name == 'pull_request' && env.pull_request_id
        uses: thollander/actions-comment-pull-request@v3
        continue-on-error: true #we need pull_request_target or this will fail when not running pr in BD organisation
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: coverage-report
          pr-number: ${{ env.pull_request_id }}
          message: |
            go-test-coverage report:
            ```
            ${{ fromJSON(steps.coverage.outputs.report) }}```
      - name: 'finally check coverage'
        if: steps.coverage.outcome == 'failure'
        shell: bash
        run: echo "coverage check failed" && exit 1

  e2e-keeper-images:
    name: Build keeper images for running e2e
    runs-on: ubuntu-22.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.run == 'true' }}
    strategy:
      matrix:
        pgversion: ['14','15','16','17','18']
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: stolon-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=keeper-${{ matrix.pgversion }},enable=true
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest
            type=sha

      - name: Build stolon images
        uses: docker/build-push-action@v7
        with:
          load: true
          build-args: PGVERSION=${{ matrix.pgversion }}
          context: .
          file: ./Dockerfile.keeper
          push: false
          platforms: linux/amd64
          tags: ${{ steps.stolon-meta.outputs.tags }}
          labels: ${{ steps.stolon-meta.outputs.labels }}

      - name: Save image to tar
        run: docker save keeper-${{ matrix.pgversion }} > keeper-${{ matrix.pgversion }}.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keeper-image-${{ matrix.pgversion }}
          path: keeper-${{ matrix.pgversion }}.tar

  e2e-other-images:
    name: Build other images for running e2e
    runs-on: ubuntu-22.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.run == 'true' }}
    strategy:
      matrix:
        image:
          - proxy
          - sentinel
          - stolonctl
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: stolon-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ matrix.image }},enable=true
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest
            type=sha

      - name: Build stolon images
        uses: docker/build-push-action@v7
        with:
          load: true
          context: .
          file: ./Dockerfile.${{ matrix.image }}
          push: false
          platforms: linux/amd64
          tags: ${{ steps.stolon-meta.outputs.tags }}
          labels: ${{ steps.stolon-meta.outputs.labels }}

      - name: Save image to tar
        run: docker save ${{ matrix.image }} > ${{ matrix.image }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-image
          path: ${{ matrix.image }}.tar

  e2e-test:
    name: Run e2e tests
    runs-on: ubuntu-22.04
    needs:
      - codechanges
      - e2e-keeper-images
      - e2e-other-images
    if: ${{ needs.codechanges.outputs.run == 'true' }}
    strategy:
      matrix:
        pgversion: ['14','15','16','17','18']
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0

      - name: Setup Golang
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      # No etcd binary needed: the e2e tests run etcd in a container (testcontainers)
      - name: Download keeper artifact
        uses: actions/download-artifact@v8
        with:
          path: images
          merge-multiple: true
          pattern: keeper-image-${{ matrix.pgversion }}

      - name: Download other artifacts
        uses: actions/download-artifact@v8
        with:
          path: images
          merge-multiple: true
          pattern: '*-image'

      - name: Load image
        run: |
          for f in images/*.tar; do
            if [ -f "$f" ]; then
              echo "Loading $f..."
              docker load < "$f"
            fi
          done

      - name: Test
        run: make e2e-test
        env:
          PGVERSION: ${{ matrix.pgversion }}
          STOLON_TEST_STORE_BACKEND: etcdv3

  license-header-test:
    name: License header test
    runs-on: ubuntu-22.04
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.run == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
      - name: Test
        run: |
          function go_files_without_license_info() {
          	find . -type f -iname '*.go' ! -path './vendor/*' ! -path './tests/*' ! -name '*_test.go' | while read -r file; do
          		head -n3 "${file}" | grep -Eq "(Copyright|generated|GENERATED)" || echo -e "  ${file}"
          	done
          }
          
          echo "Checking for license header..."
          IFS=$'\n' read -r -d '' -a licRes < <(go_files_without_license_info) || true
          if ((${#licRes[@]})); then
          	echo -e "license header checking failed:\n${licRes[*]}"
          	exit 255
          fi

          echo Success

  # The only required check of this workflow, so the ruleset doesn't change when jobs are added. It must always run,
  # and only passes when every job it needs succeeded (a skipped required check would count as a pass).
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - codechanges
      - check-go
      - lint-go
      - shellcheck
      - unit-test
      - e2e-keeper-images
      - e2e-other-images
      - e2e-test
      - license-header-test
    if: always()
    steps:
      - name: Evaluate the results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Results: ${RESULTS} (event: ${EVENT})"
          # A job skipped by a path filter is fine on a pull request; everywhere else everything must run
          if [ "${EVENT}" = pull_request ]; then ok='. == "success" or . == "skipped"'; else ok='. == "success"'; fi
          if [ "$(echo "${RESULTS}" | jq -r "all(${ok})")" != true ]; then
            echo "::error::All CI jobs must succeed"
            exit 1
          fi
